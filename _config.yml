title: "Shronda Jeanine & Co."
description: "Restoring Wholeness. Building Abundance. Holistic healing and empowerment for individuals and families seeking transformation."
url: "https://shrondaj.github.io"
baseurl: "/muse-healing-site"

author:
  name: "Shronda Jeanine"
  email: "shrondajeanine@shrondajeanineco.com"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .github

# Brand signature
brand_signature: "72079"
tagline: "with purpose on purpose"
phone: "602 759 0158"
donate_url: "https://www.buymeacoffee.com/shrondajeanine"
social:
  twitter: "https://twitter.com/shrjeacompany"
  instagram: "https://instagram.com/shrondajeanine"
  linkedin: "#"
  youtube: "https://youtube.com/@OnPurposeWithPurpose9"
  tiktok: "https://tiktok.com/@.shronda"
  facebook: "#"
