---
layout: default
title: "Find Your Healing Path"
permalink: /quiz/
---

<section style="padding-top:120px;padding-bottom:80px;min-height:100vh;display:flex;align-items:center;">
  <div class="section" style="width:100%;">
    <div class="glass" style="max-width:640px;margin:0 auto;padding:48px;" id="quizContainer">

      <!-- Quiz: active state -->
      <div id="quizActive">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;">
          <span id="quizLabel" style="font-size:0.75rem;color:var(--spark-gold);text-transform:uppercase;letter-spacing:0.15em;font-family:var(--font-body);"></span>
          <div class="quiz-progress" id="progressDots"></div>
        </div>

        <h2 id="quizQuestion" style="color:var(--raw-canvas);margin-bottom:32px;font-size:clamp(1.3rem,3vw,1.8rem);"></h2>

        <div class="quiz-options" id="quizOptions"></div>
      </div>

      <!-- Quiz: completed state -->
      <div id="quizComplete" style="display:none;text-align:center;padding:32px 0;">
        <div style="font-size:4rem;margin-bottom:24px;">🌟</div>
        <h2 style="color:var(--spark-gold);margin-bottom:16px;">Your Healing Path Is Clear</h2>
        <p style="color:var(--flow-slate);margin-bottom:8px;font-size:1.05rem;" id="resultHeading"></p>
        <p style="color:var(--flow-slate);font-size:0.95rem;margin-bottom:40px;line-height:1.8;" id="resultDetail"></p>

        <div style="padding:24px;border-radius:16px;margin-bottom:32px;" class="glass-purple">
          <p style="font-family:var(--font-display);font-size:1.2rem;color:var(--raw-canvas);margin-bottom:16px;">Ready to take the next step?</p>
          <p style="color:var(--flow-slate);font-size:0.9rem;margin-bottom:24px;">Your first session is always free. No obligations, just presence.</p>
          <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">
            <a href="{{ site.baseurl }}/#contact" class="btn btn-purple-filled">Book Free Session</a>
            <button onclick="resetQuiz()" class="btn btn-purple">Retake Quiz</button>
          </div>
        </div>

        <div id="answersReview" style="text-align:left;"></div>
      </div>

    </div>
  </div>
</section>

<script>
const questions = [
  {
    question: "What area of your life needs the most attention right now?",
    options: ["Emotional wellbeing", "Relationships", "Career / Purpose", "Physical health", "Spiritual growth"]
  },
  {
    question: "How do you prefer to receive support?",
    options: ["One-on-one", "Group setting", "Self-guided", "Family-based", "Crisis intervention"]
  },
  {
    question: "What has been your biggest challenge recently?",
    options: ["Grief / loss", "Trauma", "Addiction", "Relationship conflict", "Life transition"]
  },
  {
    question: "What does 'wholeness' mean to you?",
    options: ["Inner peace", "Strong relationships", "Purposeful work", "Physical vitality", "Spiritual connection"]
  }
];

const results = {
  default: {
    heading: "You're ready for holistic transformation.",
    detail: "Based on your answers, a personalized one-on-one coaching session will give you the tailored support you need to move forward with clarity and confidence."
  },
  group: {
    heading: "Community healing is your path.",
    detail: "You thrive in connection. Our group healing sessions and community programs will surround you with people who understand and support your journey."
  },
  family: {
    heading: "Family healing will transform your world.",
    detail: "Generational patterns can shift. Our family-centered programs create ripple effects that restore harmony to entire households."
  },
  crisis: {
    heading: "Immediate, compassionate support awaits.",
    detail: "You don't have to navigate this alone. Our 24/7 crisis support services provide a steady presence in your most challenging moments."
  }
};

let current = 0;
let answers = [];

function render() {
  const q = questions[current];
  document.getElementById('quizLabel').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('quizQuestion').textContent = q.question;

  const dots = document.getElementById('progressDots');
  dots.innerHTML = '';
  questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'quiz-dot' + (i <= current ? ' active' : '');
    dots.appendChild(d);
  });

  const opts = document.getElementById('quizOptions');
  opts.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt);
    opts.appendChild(btn);
  });
}

function handleAnswer(answer) {
  answers.push(answer);
  if (current < questions.length - 1) {
    current++;
    render();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quizActive').style.display = 'none';
  document.getElementById('quizComplete').style.display = 'block';

  // Simple result logic
  let key = 'default';
  if (answers.includes('Group setting') || answers.includes('Strong relationships')) key = 'group';
  if (answers.includes('Family-based') || answers.includes('Relationship conflict')) key = 'family';
  if (answers.includes('Crisis intervention')) key = 'crisis';

  const r = results[key];
  document.getElementById('resultHeading').textContent = r.heading;
  document.getElementById('resultDetail').textContent = r.detail;

  const review = document.getElementById('answersReview');
  review.innerHTML = '<p style="font-size:0.75rem;color:var(--flow-slate);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:12px;">Your answers</p>';
  answers.forEach((a, i) => {
    review.innerHTML += `<div style="padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);margin-bottom:8px;font-size:0.85rem;color:var(--flow-slate);">
      <span style="color:var(--spark-gold);margin-right:8px;">${i+1}.</span>${a}
    </div>`;
  });
}

function resetQuiz() {
  current = 0;
  answers = [];
  document.getElementById('quizActive').style.display = 'block';
  document.getElementById('quizComplete').style.display = 'none';
  render();
}

render();
</script>
